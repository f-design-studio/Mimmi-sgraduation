<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minni's Graduation — Invito</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9e0d5}body{font-family:Arial,Helvetica,sans-serif}main{min-height:100svh;display:grid;place-items:center}.frame{position:relative;width:min(100vw,calc(100svh * 2350 / 3526));height:min(100svh,calc(100vw * 3526 / 2350));overflow:hidden;background:#e9e0d5}.inside,.intro{position:absolute;inset:0}.inside{display:flex;align-items:center;justify-content:center;z-index:1;background:#fff}.inside img{width:100%;height:100%;object-fit:contain;display:block}.intro{z-index:2;opacity:1;transition:opacity .8s ease;background:#e9e0d5}.intro video{width:100%;height:100%;display:block;object-fit:cover}.frame.done .intro{opacity:0;pointer-events:none}.replay{position:absolute;z-index:3;bottom:16px;right:16px;padding:11px 14px;border:1px solid #b5a48e;background:rgba(255,252,246,.95);color:#6b5645;letter-spacing:.08em;font-size:11px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}.frame.done .replay{opacity:1;pointer-events:auto}.hint{position:absolute;inset:auto 0 25px;text-align:center;z-index:4;color:#6b5645;font-size:12px;display:none}.frame.needs-tap .hint{display:block}@media(max-width:600px){.replay{right:12px;bottom:12px}}
</style>
</head>
<body>
<main><section class="frame" id="frame" aria-label="Invito Minni's Graduation">
<div class="inside"><img src="volantino-minni.png" alt="Minni's Graduation — 30 novembre 2026, ore 12, Via Caserta 6"></div>
<div class="intro" id="introLayer"><video id="video" muted autoplay playsinline webkit-playsinline preload="auto" aria-label="Animazione originale di apertura"><source src="apertura-originale.mp4" type="video/mp4"></video></div>
<button id="replay" class="replay" type="button">RIVEDI L'APERTURA</button>
<div class="hint" id="hint">TOCCA PER APRIRE L'INVITO</div>
</section></main>
<script>
(()=>{
 const frame=document.getElementById('frame');const video=document.getElementById('video');const replay=document.getElementById('replay');const layer=document.getElementById('introLayer');let guard;
 function finish(){clearTimeout(guard);frame.classList.remove('needs-tap');frame.classList.add('done');video.pause()}
 function play(){clearTimeout(guard);frame.classList.remove('done','needs-tap');try{video.currentTime=0}catch(e){};const p=video.play();if(p&&p.catch)p.catch(()=>{frame.classList.add('needs-tap')});guard=setTimeout(finish,8000)}
 video.addEventListener('ended',finish);video.addEventListener('error',finish);video.addEventListener('stalled',()=>{if(video.readyState<2)finish()});
 replay.addEventListener('click',play);layer.addEventListener('click',()=>{if(frame.classList.contains('needs-tap'))play()});
 document.addEventListener('DOMContentLoaded',play);
 window.addEventListener('pageshow',()=>{if(!frame.classList.contains('done')&&video.paused)play()});
})();
</script>
</body>
</html>
