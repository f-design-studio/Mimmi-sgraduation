
<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>Minni's Graduation — Invito</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9e0d5}body{font-family:Arial,Helvetica,sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:0}.frame{position:relative;width:min(100%,calc(100svh * 2350 / 3526));aspect-ratio:2350/3526;max-height:100svh;overflow:hidden;background:#e9e0d5}.intro,.inside{position:absolute;inset:0}.intro{z-index:2;opacity:1;transition:opacity .75s ease}.intro video{display:block;width:100%;height:100%;object-fit:cover}.inside{z-index:1;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.985);transition:opacity .95s ease,transform 1.1s ease;background:#fff}.inside img{display:block;width:100%;height:100%;object-fit:contain}.frame.done .intro{opacity:0;pointer-events:none}.frame.done .inside{opacity:1;transform:scale(1)}.replay{position:absolute;z-index:3;right:16px;bottom:16px;border:1px solid #b5a48e;background:rgba(255,252,246,.93);padding:11px 15px;letter-spacing:.12em;font-size:10px;color:#6b5645;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}.frame.done .replay{opacity:1;pointer-events:auto}@media(max-width:600px){.replay{bottom:12px;right:12px}}
</style></head><body><main><section aria-label="Invito alla laurea di Minni" class="frame" id="frame"><div class="intro"><video aria-label="Animazione di apertura della busta" autoplay="" id="intro" muted="" playsinline="" preload="auto" webkit-playsinline=""><source src="apertura-originale.mp4" type="video/mp4"/></video></div><div class="inside"><img alt="Minni's Graduation — Dipartimento di Scienze Odontostomatologiche e Maxillo Facciali, lunedì 30 novembre 2026, ore 12, Via Caserta 6" src="volantino-minni.png"/></div><button class="replay" id="replay" type="button">RIVEDI L'APERTURA</button></section></main><script>
(()=>{const frame=document.getElementById('frame'),video=document.getElementById('intro'),replay=document.getElementById('replay');let fallback;function show(){clearTimeout(fallback);frame.classList.add('done');video.pause()}function start(){clearTimeout(fallback);frame.classList.remove('done');video.currentTime=0;const p=video.play();if(p&&p.catch)p.catch(()=>{video.controls=true});fallback=setTimeout(show,5500)}video.addEventListener('ended',show);video.addEventListener('error',()=>{video.controls=true});replay.addEventListener('click',start);video.addEventListener('click',()=>{if(video.paused&&!frame.classList.contains('done'))video.play()});window.addEventListener('load',()=>{if(video.paused)video.play().catch(()=>{video.controls=true})});})();
</script></body></html>
